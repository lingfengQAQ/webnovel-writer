packages:
  - packages/*
# core ↔ review 循环 devDeps 为历史结构（测试互相引用夹具），沿用 pnpm 9 的任意顺序执行
ignoreWorkspaceCycles: true
# GHSA-68fv-2mgg-jv7q: keep the test toolchain on the patched source-map parser.
overrides:
  'source-map-js@<1.2.2': '1.2.2'
  # GHSA-587h-7wmj-h5pm: patch the existing Vite 8.3 test-toolchain resolution.
  'vite@>=8.3.0 <8.3.3': '8.3.3'
  # GHSA-mrhx-c7xc-m3w5: patch Zod 4 in the development SDK dependency graph.
  'zod@>=4.0.0 <4.6.6': '4.6.6'
  # GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm:
  # patch only the pinned development SDK's proxy dependency; DSH supplies its own runtime.
  '@deepseek-ai/dsh-http-proxy@0.2.2-rc.3>undici': '8.12.2'
# pnpm 10+ 默认阻断依赖构建脚本；仅放行构建/测试确实需要的原生组件
allowBuilds:
  esbuild: true
  koffi: true
