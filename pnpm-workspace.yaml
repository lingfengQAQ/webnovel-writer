packages:
  - packages/*
# core ↔ review 循环 devDeps 为历史结构（测试互相引用夹具），沿用 pnpm 9 的任意顺序执行
ignoreWorkspaceCycles: true
# GHSA-68fv-2mgg-jv7q: keep the test toolchain on the patched source-map parser.
overrides:
  'source-map-js@<1.2.2': '1.2.2'
# pnpm 10+ 默认阻断依赖构建脚本；仅放行构建/测试确实需要的原生组件
allowBuilds:
  esbuild: true
  koffi: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@0.2.0-rc.2'
  - '@deepseek-ai/dsh-agent-loop@0.2.0-rc.2'
