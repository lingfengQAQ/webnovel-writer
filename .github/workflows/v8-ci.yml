name: v8 CI
on:
  pull_request:
    branches: [v8]
  push:
    branches: [v8]
permissions:
  contents: read
concurrency:
  group: v8-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: v8-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public
      - run: pnpm check:version
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm test:release
      - run: pnpm docs:style --all --check
  quality:
    name: v8-quality-${{ matrix.node }}-${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.9.0', '24.15.0']
        shard: [1, 2, 3, 4]
    env:
      WEBNOVEL_LOADER_REPORT: ${{ github.workspace }}/.tmp/ci/loader.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run every test once per Node version across four shards
        run: pnpm test --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --reporter=./scripts/release/ci-reporter.mjs --outputFile=.tmp/ci/results.json
      - name: Preserve timings and worker failure diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ matrix.node }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .tmp/ci/
          include-hidden-files: true
          retention-days: 14
  build:
    name: v8-build-${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.9.0', '24.15.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @linfengqaqtat/dsh-scriptor typecheck
      - run: pnpm --filter @linfengqaqtat/dsh-scriptor dump-config-check
      - run: pnpm --filter @linfengqaqtat/dsh-scriptor pack-check
      - name: Generated notices are current
        run: |
          node --input-type=module -e "import { restoreNoticeLineEndings } from './scripts/release/release-source.mjs'; restoreNoticeLineEndings(process.cwd())"
          git diff --exit-code
  portability:
    name: v8-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
  macos:
    name: v8-macos-observation
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
  required:
    name: v8-required
    runs-on: ubuntu-latest
    needs: [policy, quality, build, portability]
    if: always()
    steps:
      - name: All Windows and Linux checks passed
        env:
          RESULT: ${{ needs.quality.result }}
          POLICY: ${{ needs.policy.result }}
          BUILD: ${{ needs.build.result }}
          LINUX: ${{ needs.portability.result }}
        run: test "$RESULT" = success && test "$POLICY" = success && test "$LINUX" = success && test "$BUILD" = success
