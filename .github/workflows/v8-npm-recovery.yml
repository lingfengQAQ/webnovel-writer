name: v8 npm first-publish recovery
on:
  push:
    branches: [codex/publish-path-verification]
permissions:
  contents: read
concurrency:
  group: v8-npm-scriptor-v0.1.0-preview.5
  cancel-in-progress: false
env:
  RELEASE_TAG: scriptor-v0.1.0-preview.5
jobs:
  repair:
    if: github.repository == 'lingfengQAQ/webnovel-writer' && github.ref == 'refs/heads/codex/publish-path-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
      - name: Download the unchanged published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --dir .tmp/npm-release --pattern '*.tgz' --pattern 'SHA256SUMS' --pattern 'release-manifest.json'
      - name: Check the recovery contract
        run: node --test scripts/release/tests/first-publish-repair.test.mjs
      - name: Validate all original bytes and clear implicit first-publish latest tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release/repair-first-publish.mjs --assets .tmp/npm-release --apply
  installation:
    needs: repair
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: scriptor-v0.1.0-preview.5
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: Download the original release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download $env:RELEASE_TAG --dir .tmp/npm-release --pattern '*.tgz' --pattern 'SHA256SUMS' --pattern 'release-manifest.json'
      - name: Install the registry main and full packages in clean profiles
        run: |
          $manifest = Get-Content .tmp/npm-release/release-manifest.json -Raw | ConvertFrom-Json
          $main = Join-Path .tmp/npm-release $manifest.filename
          $embedding = Join-Path .tmp/npm-release ($manifest.optionalPackages | Where-Object name -eq 'webnovel-embedding-provider').tarball
          $meta = Join-Path .tmp/npm-release ($manifest.optionalPackages | Where-Object name -eq '@linfengqaqtat/dsh-scriptor-full').tarball
          node scripts/release/install-smoke.mjs $main $embedding $meta --registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
